name: kev-watch
on:
  schedule:
    - cron: '30 13 * * *' # daily, after CISA and FIRST publish
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/kev-watch.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md KEV-WATCH.md
          git diff --cached --quiet || { git commit -m "KEV Watch: $(date -u +%F)"; git push; }
